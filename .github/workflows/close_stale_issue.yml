name: "Close stale issues and pull requests"

on:
  schedule:
    - cron: "0 8 * * *"

jobs:
  stale:
    if: github.repository == 'pluginsGLPI/fields'
    permissions:
      issues: "write" # for actions/stale to close stale issues
      pull-requests: "write" # for actions/stale to close stale pull requests
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/stale@v11"
        with:
          stale-issue-message: >-
            There has been no activity on this issue for 60 days and therefore it is considered stale
            and will be closed automatically in 14 days.


            If this issue is related to a bug, please try to reproduce on latest release. If the problem persists,
            feel free to add a comment to revive this issue.
          stale-pr-message: >-
            There has been no activity on this pull request for 90 days and therefore it is considered stale
            and will be closed automatically in 14 days.
            Feel free to add a comment or push new commits to keep it open.
          days-before-issue-stale: 60
          days-before-pr-stale: 90
          days-before-close: 14
          exempt-issue-labels: "bug,enhancement,question,security" # Issues with "bug", "enhancement", "question" or "security" labels will not be marked as stale
          exempt-pr-labels: "security" # PR with "security" label will not be marked as stale
          exempt-draft-pr: true # Draft PR are work in progress.
          exempt-all-milestones: true # Do not check issues/PR with defined milestone.
          ascending: true # First check older issues/PR.
          operations-per-run: 750 # Max API calls per run.
